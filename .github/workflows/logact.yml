name: Android Logcat Collector (Tailscale)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: ''
        required: false
        default: '60'

jobs:
  capture-logcat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install ADB Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-tools-adb

      - name: Pair and Connect to Android Device
        run: |
          PHONE_IP="100.115.73.81"
          PAIR_PORT="36231"
          PAIR_CODE="855934"
          CONN_PORT="32829"

          echo "$PAIR_CODE" | adb pair $PHONE_IP:$PAIR_PORT
          adb connect $PHONE_IP:$CONN_PORT
          adb devices

      - name: Start Logging On-Device
        run: |
          adb shell "rm -f /sdcard/logcat.log"
          adb shell "nohup logcat -f /sdcard/logcat.log *:V > /dev/null 2>&1 &"
          
          DURATION=${{ github.event.inputs.duration }}
          echo "Logging active. Waiting $DURATION seconds..."
          sleep $DURATION

      - name: Pull Logcat File from Phone
        run: |
          PHONE_IP="100.115.73.81"
          CONN_PORT="32829"
          
          adb connect $PHONE_IP:$CONN_PORT || true
          adb pull /sdcard/logcat.log ./android_logcat.log
          adb shell "pkill -f logcat" || true

      - name: Upload Logcat Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-logcat-file
          path: android_logcat.log
          retention-days: 7
