name: Android Remote with Tailscale

on:
  workflow_dispatch:

jobs:
  android-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-android-$GITHUB_RUN_ID
          echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Enable KVM (Hardware Acceleration)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo adduser $USER kvm

      - name: Run Android Container / Emulator
        run: |
     
          docker run -d --privileged \
            --name redroid \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest

      - name: Show Connection Info
        run: |
          echo "=========================================="
          echo "Tailscale IP: $TS_IP"
          echo "Connect via ADB: adb connect $TS_IP:5555"
          echo "Use 'scrcpy --tcpip=$TS_IP:5555' to view screen"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
