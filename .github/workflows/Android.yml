name: Android Remote with VNC

on:
  workflow_dispatch:

jobs:
  android-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-android-$GITHUB_RUN_ID
          echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Run Android Container with VNC
        run: |
          docker run -d --privileged \
            --name redroid \
            -p 5555:5555 \
            -p 5900:5900 \
            sickcodes/docker-headless-vnc-container

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
