name: Android 10 ARM64 Remote

on:
  workflow_dispatch:

jobs:
  android-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-android-$GITHUB_RUN_ID
          echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Enable ARM64 Emulation (QEMU-binfmt)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Run Redroid Android 10 ARM64
        run: |
          docker run -d --privileged \
            --name redroid \
            --platform linux/arm64 \
            -p 5555:5555 \
            redroid/redroid:10.0.0-latest

      - name: Run WebVNC & ADB Bridge
        run: |
          docker run -d \
            --name scrcpy-web \
            --net=host \
            -e ADB_SERVER_SOCKET=tcp:127.0.0.1:5555 \
            emptythere/scrcpy-web:latest || true

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
